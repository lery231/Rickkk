name: Build 1001 SK APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan sumber (otomatis ekstrak ZIP kalau ada)
        id: src
        run: |
          echo "Isi root repo:"
          ls -la
          ZIP=$(ls *.zip 2>/dev/null | sort -V | tail -n 1 || true)
          BASE="."
          if [ -n "$ZIP" ]; then
            echo "Memakai ZIP: $ZIP"
            rm -rf _src
            mkdir _src
            unzip -q -o "$ZIP" -d _src
            BASE="_src"
          else
            echo "Tidak ada ZIP, memakai file langsung di repo."
          fi
          DIR=""
          for p in $(find "$BASE" -name package.json -not -path '*/node_modules/*' | sort); do
            d=$(dirname "$p")
            if [ -f "$d/index.html" ]; then DIR="$d"; break; fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::index.html dan package.json tidak ditemukan. Upload ZIP proyek ke root repo."
            find "$BASE" -not -path '*/node_modules/*' -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Folder proyek: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ steps.src.outputs.dir }}
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build web
        working-directory: ${{ steps.src.outputs.dir }}
        run: npm run build

      - name: Buat proyek Android
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error @capacitor/cli@6.1.2 @capacitor/core@6.1.2 @capacitor/android@6.1.2
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.sk1001.coffee","appName":"1001 SK","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android

      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 1001-SK-apk
          path: ${{ steps.src.outputs.dir }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

