name: Build 1001 SK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cari folder proyek (yang berisi index.html + package.json)
        id: find
        run: |
          DIR=$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 dirname | while read d; do [ -f "$d/index.html" ] && echo "$d" && break; done)
          if [ -z "$DIR" ]; then
            echo "::error::index.html dan package.json tidak ditemukan di repo"; ls -R | head -50; exit 1
          fi
          echo "Folder proyek: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm install

      - name: Build web app
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1001-SK-dist
          path: ${{ steps.find.outputs.dir }}/dist/
