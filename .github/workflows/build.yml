name: Build 1001 SK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan sumber (otomatis ekstrak ZIP kalau ada)
        id: src
        run: |
          echo "Isi root repo:"
          ls -la
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          BASE="."
          if [ -n "$ZIP" ]; then
            echo "Memakai ZIP: $ZIP"
            rm -rf _src
            mkdir _src
            unzip -q -o "$ZIP" -d _src
            BASE="_src"
          else
            echo "Tidak ada ZIP, memakai file langsung di repo."
          fi
          DIR=""
          for p in $(find "$BASE" -name package.json -not -path '*/node_modules/*' | sort); do
            d=$(dirname "$p")
            if [ -f "$d/index.html" ]; then DIR="$d"; break; fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::index.html dan package.json tidak ditemukan. Upload ZIP proyek ke root repo."
            find "$BASE" -not -path '*/node_modules/*' -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Folder proyek: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ steps.src.outputs.dir }}
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build
        working-directory: ${{ steps.src.outputs.dir }}
        run: npm run build

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: 1001-SK-dist
          path: ${{ steps.src.outputs.dir }}/dist/
          if-no-files-found: error
